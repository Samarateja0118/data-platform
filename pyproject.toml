[project]
name = "ridestream"
version = "0.1.0"
description = "Streaming + batch ELT data platform on Redpanda, Postgres, dbt and Airflow"
requires-python = ">=3.11,<3.12"
dependencies = [
  "confluent-kafka==2.16.1",
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dbt = ["dbt-core==1.12.6", "dbt-postgres==1.10.2"]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["dbt/ridestream/target", "dbt/ridestream/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Redpanda + Postgres running"]
