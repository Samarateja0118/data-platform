version: 2
sources:
  - name: raw
    schema: raw
    description: Landing tables written by the streaming consumer (deduplicated on event_id).
    tables:
      - name: ride_events
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 5, period: minute}
          error_after: {count: 60, period: minute}
        columns:
          - name: event_id
            data_tests: [unique, not_null]
  - name: stream
    schema: stream
    tables:
      - name: zone_minute_metrics
        description: 1-minute tumbling-window aggregates maintained by the consumer.
  - name: ops
    schema: ops
    tables:
      - name: consumer_offsets
      - name: dead_letters
